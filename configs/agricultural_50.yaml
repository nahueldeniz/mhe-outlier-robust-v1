# Half the samples corrupted -- the hardest column of Fig. 3(c).
beta_max_deg: 70
n_trailers: 1
ts: 0.05
steps: 800
speed: 1.0
estimator: {n_window: 10, alpha: 1.0, c: 1.0}
controller: {n_control: 8, n_prediction: 8}
sensors: {mode: scattered, delta: 0.50, seed: 7}
# Ts = 0.05 s. The field run samples at 5 Hz because the hardware does; a simulation has no
# such excuse, and a coarser period is the wrong place to save time here: at 1 m/s the 2 m bulb
# turns of Fig. 2 rotate the vehicle about 3 deg per sample at 0.05 s and about 12 deg at 0.2 s,
# and the paper's |w| <= 0.01 box cannot absorb the integration mismatch at the coarse end.
# See NOTES.md, section 'Sampling rate'.
